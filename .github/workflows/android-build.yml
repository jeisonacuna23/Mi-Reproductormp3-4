name: Android CI - Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos al Gradle Wrapper
      run: chmod +x ./gradlew

    - name: Decodificar Keystore (Python)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        python3 -c "import base64, os; open('release.jks', 'wb').write(base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split())))"
        echo "KEYSTORE_FILE=$(pwd)/release.jks" >> $GITHUB_ENV

    - name: Compilar APK de Release Firmada
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-release-firmada
        path: app/build/outputs/apk/release/app-release.apk
